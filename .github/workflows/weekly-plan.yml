name: Generate weekly LeetCode plan

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-plan:
    runs-on: ubuntu-latest
    env:
      LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
      LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
      LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      STORAGE_BACKEND: local
      OUTPUT_DIR: data/plans
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Generate and upload weekly plan
        run: uv run leetcode-coach
      - name: Upload weekly plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: leetcode-plan-${{ github.run_id }}
          path: data/plans/*.md
          if-no-files-found: error
          retention-days: 90
      - name: Add download instructions to run summary
        run: |
          {
            echo "## LeetCode weekly plan"
            echo
            echo "The generated Markdown file is available in the **leetcode-plan-${{ github.run_id }}** artifact above."
            echo
            echo "Artifact retention: 90 days."
          } >> "$GITHUB_STEP_SUMMARY"
