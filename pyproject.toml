[project]
dependencies = [
    "boto3",
    "httpx2",
    "openai",
    "pydantic-ai",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
]
name = "leetcode-coach"
version = "0.1.0"
description = "Generate personalized weekly LeetCode review and practice plans."
readme = "README.md"
authors = [{ name = "septimochen", email = "qizu.chen@hotmail.com" }]
requires-python = ">=3.14"

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[project.scripts]
leetcode-coach = "leetcode_coach:main"
fetch-progress = "leetcode_coach.cli:fetch_progress"


[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
